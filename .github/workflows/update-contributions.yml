name: Update Aurora Circuit Contributions

on:
  schedule:
    # Runs daily at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  update-calendar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch Real Contributions and Rebuild Aurora Circuit SVG
        run: node scripts/generate-aurora-circuit.js

      - name: Commit & Push Changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action [Aurora Circuit]"
          git add assets/aurora-circuit.svg
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(telemetry): update Aurora Circuit real contributions [skip ci]" && git push)
