<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 8" width="100%" height="8" role="img" aria-label="Animated Colorful Divider Line">
  <defs>
    <linearGradient id="colorCycle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6">
        <animate attributeName="stop-color" values="#8B5CF6;#22D3EE;#39D98A;#EC4899;#F59E0B;#8B5CF6" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="25%" stop-color="#22D3EE">
        <animate attributeName="stop-color" values="#22D3EE;#39D98A;#EC4899;#F59E0B;#8B5CF6;#22D3EE" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#39D98A">
        <animate attributeName="stop-color" values="#39D98A;#EC4899;#F59E0B;#8B5CF6;#22D3EE;#39D98A" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="75%" stop-color="#EC4899">
        <animate attributeName="stop-color" values="#EC4899;#F59E0B;#8B5CF6;#22D3EE;#39D98A;#EC4899" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#8B5CF6">
        <animate attributeName="stop-color" values="#8B5CF6;#22D3EE;#39D98A;#EC4899;#F59E0B;#8B5CF6" dur="4s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect x="0" y="2" width="1200" height="4" rx="2" fill="url(#colorCycle)" filter="url(#glow)"/>
</svg>
