<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="auto" role="img" aria-label="Swaliya Mujawar Developer Hero Banner">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f0c"/>
      <stop offset="50%" stop-color="#0f1612"/>
      <stop offset="100%" stop-color="#141d17"/>
    </linearGradient>

    <!-- Radial Soft Sage Glow -->
    <radialGradient id="radialSage" cx="18%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#a3cf9a" stop-opacity="0.14"/>
      <stop offset="60%" stop-color="#a3cf9a" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#a3cf9a" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="nodeGlow" cx="80%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#7ee787" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#7ee787" stop-opacity="0"/>
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="techGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#233226" stroke-width="0.7" stroke-opacity="0.45"/>
      <circle cx="40" cy="40" r="1" fill="#4d6852" fill-opacity="0.4"/>
    </pattern>

    <linearGradient id="accentBar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7ee787"/>
      <stop offset="50%" stop-color="#a3cf9a"/>
      <stop offset="100%" stop-color="#3d5a42"/>
    </linearGradient>

    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <style>
    .mono { font-family: 'SF Mono', 'Fira Code', 'Consolas', 'Courier New', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', 'Roboto', Helvetica, Arial, sans-serif; }
    .status-text { font-size: 11px; fill: #8fad92; letter-spacing: 2.2px; font-weight: 600; }
    .title-name { font-size: 48px; fill: #f2f5ef; font-weight: 700; letter-spacing: -0.5px; }
    .title-tagline { font-size: 16px; fill: #b8c9ba; font-weight: 400; }
    .meta-label { font-size: 11px; fill: #728c76; letter-spacing: 1.5px; font-weight: 600; }
    .meta-val { font-size: 13px; fill: #d5e2d4; font-weight: 500; }
    .node-text { font-size: 12px; fill: #e1eae0; font-weight: 600; }
    .node-sub { font-size: 10px; fill: #86a38b; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="340" rx="16" fill="url(#bgGrad)"/>
  <rect width="1200" height="340" rx="16" fill="url(#radialSage)"/>
  <rect width="1200" height="340" rx="16" fill="url(#nodeGlow)"/>

  <!-- Subtle Blueprint Grid (Right half) -->
  <rect x="580" y="0" width="620" height="340" rx="16" fill="url(#techGrid)"/>

  <!-- Outer Border -->
  <rect x="1" y="1" width="1198" height="338" rx="15" fill="none" stroke="#253528" stroke-width="1.5"/>

  <!-- Left Accent Vertical Pillar -->
  <rect x="0" y="24" width="6" height="292" rx="3" fill="url(#accentBar)"/>

  <!-- Status Pill / Live Badge -->
  <g transform="translate(60, 46)">
    <rect width="370" height="28" rx="14" fill="#142017" stroke="#283d2e" stroke-width="1"/>
    <circle cx="16" cy="14" r="4.5" fill="#7ee787"/>
    <circle cx="16" cy="14" r="7.5" fill="#7ee787" fill-opacity="0.2"/>
    <text x="32" y="18" class="mono status-text">SECOND-YEAR CSE • FULL-STACK &amp; SYSTEMS</text>
  </g>

  <!-- Main Headline Identity -->
  <text x="60" y="132" class="sans title-name">Swaliya Mujawar</text>

  <!-- Subtitle / Mission Statement -->
  <text x="60" y="174" class="sans title-tagline">Building thoughtful full-stack web applications and software systems.</text>
  <text x="60" y="200" class="sans title-tagline">Driven by craft, disciplined curiosity, and learning from first principles.</text>

  <!-- Key Attributes Footer Strip -->
  <g transform="translate(60, 248)">
    <!-- Column 1 -->
    <g transform="translate(0, 0)">
      <text x="0" y="0" class="mono meta-label">FOCUS DIRECTION</text>
      <text x="0" y="22" class="sans meta-val">Full-Stack Web • Distributed APIs • C++ DSA</text>
    </g>
    <!-- Divider -->
    <line x1="330" y1="-8" x2="330" y2="28" stroke="#253528" stroke-width="1"/>
    <!-- Column 2 -->
    <g transform="translate(360, 0)">
      <text x="0" y="0" class="mono meta-label">CORE ACTIVE BUILDS</text>
      <text x="0" y="22" class="sans meta-val">LUMI (React &amp; Tailwind) • KrishiLens (FastAPI &amp; UI)</text>
    </g>
  </g>

  <!-- Visual Architecture / Node Diagram on the Right -->
  <g transform="translate(710, 36)">
    <!-- Node Wire Connections -->
    <path d="M 70 70 L 210 70 L 320 140 L 210 210 L 70 210 Z" fill="none" stroke="#2e4233" stroke-width="1.5" stroke-dasharray="4 4"/>
    <path d="M 70 70 L 70 210" fill="none" stroke="#2e4233" stroke-width="1.5"/>
    <path d="M 210 70 L 210 210" fill="none" stroke="#2e4233" stroke-width="1.5"/>
    <line x1="70" y1="140" x2="320" y2="140" stroke="#a3cf9a" stroke-width="1.5" opacity="0.5"/>

    <!-- Node 1: Frontend Layer -->
    <g transform="translate(30, 46)" filter="url(#subtleShadow)">
      <rect width="115" height="48" rx="8" fill="#131c15" stroke="#37523d" stroke-width="1.2"/>
      <circle cx="16" cy="24" r="4" fill="#a3cf9a"/>
      <text x="28" y="22" class="sans node-text">Interface</text>
      <text x="28" y="36" class="mono node-sub">React 19 • Tailwind</text>
    </g>

    <!-- Node 2: Backend / API Layer -->
    <g transform="translate(175, 46)" filter="url(#subtleShadow)">
      <rect width="115" height="48" rx="8" fill="#131c15" stroke="#37523d" stroke-width="1.2"/>
      <circle cx="16" cy="24" r="4" fill="#7ee787"/>
      <text x="28" y="22" class="sans node-text">Service / API</text>
      <text x="28" y="36" class="mono node-sub">Node • Express • Py</text>
    </g>

    <!-- Node 3: Data / Store Layer -->
    <g transform="translate(175, 186)" filter="url(#subtleShadow)">
      <rect width="115" height="48" rx="8" fill="#131c15" stroke="#37523d" stroke-width="1.2"/>
      <circle cx="16" cy="24" r="4" fill="#b6cf91"/>
      <text x="28" y="22" class="sans node-text">Data / State</text>
      <text x="28" y="36" class="mono node-sub">MongoDB • SQL</text>
    </g>

    <!-- Node 4: Systems / Core Layer -->
    <g transform="translate(30, 186)" filter="url(#subtleShadow)">
      <rect width="115" height="48" rx="8" fill="#131c15" stroke="#37523d" stroke-width="1.2"/>
      <circle cx="16" cy="24" r="4" fill="#8fad92"/>
      <text x="28" y="22" class="sans node-text">Core Systems</text>
      <text x="28" y="36" class="mono node-sub">C++ • OOP • Git</text>
    </g>

    <!-- Central Hub: Verified Build -->
    <g transform="translate(290, 118)" filter="url(#subtleShadow)">
      <rect width="125" height="44" rx="8" fill="#18261b" stroke="#4e7254" stroke-width="1.5"/>
      <circle cx="16" cy="22" r="5" fill="#7ee787"/>
      <text x="28" y="21" class="sans node-text">Shipped Code</text>
      <text x="28" y="34" class="mono node-sub">Tested &amp; Intentional</text>
    </g>
  </g>

  <!-- Coordinate Corner Accent -->
  <text x="1165" y="322" class="mono" font-size="9" fill="#3d5341" text-anchor="end">SYS.SWALIYA // ARCH.V2</text>
</svg>
